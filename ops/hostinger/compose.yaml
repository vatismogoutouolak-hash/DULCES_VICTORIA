services:
  academy:
    build:
      context: ../..
      dockerfile: ops/hostinger/Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/dulces-victoria/production.env
    network_mode: host
    environment:
      HOST: 127.0.0.1
      TRUST_LOOPBACK_PROXY: "true"
    volumes:
      - /srv/dulces-victoria/videos:/srv/videos:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r=await fetch('http://127.0.0.1:3000/health');process.exit(r.ok?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
