name: Verify platform
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix tests/security
      - run: npm ci --prefix video-server
      - run: npm run build
      - run: node --test scripts/*.test.mjs
      - run: npm run test:video
      - run: npx -y firebase-tools@latest emulators:exec --project demo-dulces --only firestore 'npm --prefix tests/security test'
